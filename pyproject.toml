[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seccode-mobile"
version = "0.1.0"
description = "Autonomous Multi-Agent Audit and Remediation Engine for OWASP Mobile Top 10 in Flutter Applications"
authors = [{ name = "Muhammad Favian Jiwani", email = "mfavianj@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "click>=8.1.0",
]

[project.scripts]
seccode = "seccode.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
